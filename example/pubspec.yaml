name: dhis2_flutter_sdk_example
description: Example app demonstrating the DHIS2 Flutter SDK.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  dhis2_flutter_sdk:
    path: ../
  fl_chart: ^0.66.0
  provider: ^6.1.1
  go_router: ^13.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
